name: Blender add-on dev build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Create installable add-on ZIP
        run: |
          mkdir -p dist
          cd addon
          zip -qr ../dist/AnyModel_Blender_Addon-dev.zip avatar_action_bridge
      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: AnyModel-Blender-Addon-dev
          path: dist/AnyModel_Blender_Addon-dev.zip
          if-no-files-found: error
